# ==============================================================================
# Alacritty Terminal Configuration (~/.config/alacritty/alacritty.toml)
# Theme: Cukup Dark (Blurred)
# Managed via GNU Stow in ~/.dotfiles/alacritty/.config/alacritty/alacritty.toml
# Docs: https://alacritty.org/config-alacritty.html
# ==============================================================================

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"
TERM_PROGRAM = "Alacritty"

[window]
dimensions = { columns = 122, lines = 63 }
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "Buttonless"
opacity = 0.82
blur = true
option_as_alt = "Both"
startup_mode = "Windowed"

[scrolling]
history = 50000
multiplier = 3

# ------------------------------------------------------------------------------
# Typography (CommitMono Nerd Font)
# ------------------------------------------------------------------------------
[font]
size = 12.0
offset = { x = 0, y = 2 }

[font.normal]
family = "CommitMono Nerd Font"
style = "Regular"

[font.bold]
family = "CommitMono Nerd Font"
style = "Bold"

[font.italic]
family = "CommitMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CommitMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# ------------------------------------------------------------------------------
# Color Scheme: Cukup Senja (Warm Terracotta, Dusty Lilac & Celadon)
# ------------------------------------------------------------------------------
[colors]
transparent_background_colors = true

[colors.primary]
background = "#181816"
foreground = "#D8D5CD"
bright_foreground = "#F4F2EC"
dim_foreground = "#78776F"

[colors.cursor]
text = "#181816"
cursor = "#E89058"

[colors.selection]
text = "#F4F2EC"
background = "#3A3530"

[colors.normal]
black   = "#181816"
red     = "#DE6E75"
green   = "#89BA81"
yellow  = "#E89058"
blue    = "#6BAFAD"
magenta = "#B294C7"
cyan    = "#6BAFAD"
white   = "#D8D5CD"

[colors.bright]
black   = "#5E5D56"
red     = "#EA8A90"
green   = "#A2D19A"
yellow  = "#F2A979"
blue    = "#87C7C5"
magenta = "#CCAEE1"
cyan    = "#87C7C5"
white   = "#F4F2EC"

[colors.dim]
black   = "#11110F"
red     = "#B84E55"
green   = "#6B9664"
yellow  = "#C4723E"
blue    = "#4F8F8D"
magenta = "#9275A6"
cyan    = "#4F8F8D"
white   = "#78776F"

# ------------------------------------------------------------------------------
# Keybindings (Word Navigation, Clear Screen, New Window, & Zellij Bottom Tabs)
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

# Window Fullscreen & Maximize Controls
[[keyboard.bindings]]
key = "F"
mods = "Command|Control"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Return"
mods = "Command"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "M"
mods = "Command|Alt"
action = "ToggleMaximized"

[[keyboard.bindings]]
key = "F"
mods = "Command|Alt"
action = "ToggleSimpleFullscreen"

[[keyboard.bindings]]
key = "K"
mods = "Command"
chars = "\u000C"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u0017"

# Zellij Bottom Tab & Split Pane Shortcuts (Replaces macOS Native Top Tab Bar)
[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u001Bt"

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u001Bw"

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u001Bd"

[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u001BD"

# Split Panes Focus Navigation (Cmd + Option + Arrows)
[[keyboard.bindings]]
key = "Left"
mods = "Command|Alt"
chars = "\u001Bh"

[[keyboard.bindings]]
key = "Right"
mods = "Command|Alt"
chars = "\u001Bl"

[[keyboard.bindings]]
key = "Up"
mods = "Command|Alt"
chars = "\u001Bk"

[[keyboard.bindings]]
key = "Down"
mods = "Command|Alt"
chars = "\u001Bj"

# Split Panes Directional Resize (Cmd + Ctrl + Arrows)
[[keyboard.bindings]]
key = "Left"
mods = "Command|Control"
chars = "\u001BH"

[[keyboard.bindings]]
key = "Right"
mods = "Command|Control"
chars = "\u001BL"

[[keyboard.bindings]]
key = "Up"
mods = "Command|Control"
chars = "\u001BK"

[[keyboard.bindings]]
key = "Down"
mods = "Command|Control"
chars = "\u001BJ"

# Split Panes General Resize (Cmd + Option + Equals/Minus)
[[keyboard.bindings]]
key = "Equals"
mods = "Command|Alt"
chars = "\u001B="

[[keyboard.bindings]]
key = "Minus"
mods = "Command|Alt"
chars = "\u001B-"

# Split Pane Maximize / Zoom Toggle (Cmd + Shift + Enter)
[[keyboard.bindings]]
key = "Return"
mods = "Command|Shift"
chars = "\u001Bz"

# Floating Pane Toggle (Cmd + Shift + F)
[[keyboard.bindings]]
key = "F"
mods = "Command|Shift"
chars = "\u001Bf"

# Swap Split Layout / Rotate (Cmd + Option + Left/Right Bracket)
[[keyboard.bindings]]
key = "LBracket"
mods = "Command|Alt"
chars = "\u001B{"

[[keyboard.bindings]]
key = "RBracket"
mods = "Command|Alt"
chars = "\u001B}"

