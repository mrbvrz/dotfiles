chars = "\u001Br"

[[keyboard.bindings]]
key = "LBracket"
mods = "Command|Shift"
chars = "\u001B["

[[keyboard.bindings]]
key = "RBracket"
mods = "Command|Shift"
chars = "\u001B]"

[[keyboard.bindings]]
key = "Key1"
mods = "Command"
chars = "\u001B1"

