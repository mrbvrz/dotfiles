mods = "Command|Control"
chars = "\u001BK"

[[keyboard.bindings]]
key = "Down"
mods = "Command|Control"
chars = "\u001BJ"

# Split Panes General Resize (Cmd + Option + Equals/Minus)
[[keyboard.bindings]]
key = "Equals"
mods = "Command|Alt"
chars = "\u001B="

[[keyboard.bindings]]
key = "Minus"
mods = "Command|Alt"
chars = "\u001B-"

# Split Pane Maximize / Zoom Toggle (Cmd + Shift + Enter)
[[keyboard.bindings]]
key = "Return"
mods = "Command|Shift"
chars = "\u001Bz"

# Floating Pane Toggle (Cmd + Shift + F)
[[keyboard.bindings]]
key = "F"
mods = "Command|Shift"
chars = "\u001Bf"

# Swap Split Layout / Rotate (Cmd + Option + Left/Right Bracket)
[[keyboard.bindings]]
key = "LBracket"
mods = "Command|Alt"
chars = "\u001B{"

[[keyboard.bindings]]
key = "RBracket"
mods = "Command|Alt"
chars = "\u001B}"

