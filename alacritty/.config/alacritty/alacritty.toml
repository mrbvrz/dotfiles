# ==============================================================================
# Alacritty Terminal Configuration (~/.config/alacritty/alacritty.toml)
# Theme: Cukup Kopi (Blurred)
# Managed via GNU Stow in ~/.dotfiles/alacritty/.config/alacritty/alacritty.toml
# Docs: https://alacritty.org/config-alacritty.html
# ==============================================================================

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"
TERM_PROGRAM = "Alacritty"

[window]
dimensions = { columns = 122, lines = 63 }
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "Buttonless"
opacity = 0.82
blur = true
option_as_alt = "Both"
startup_mode = "Windowed"

[scrolling]
history = 50000
multiplier = 3

# ------------------------------------------------------------------------------
# Typography (CommitMono Nerd Font)
# ------------------------------------------------------------------------------
[font]
size = 12.0
offset = { x = 0, y = 2 }

[font.normal]
family = "CommitMono Nerd Font"
style = "Regular"

[font.bold]
family = "CommitMono Nerd Font"
style = "Bold"

[font.italic]
family = "CommitMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CommitMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# ------------------------------------------------------------------------------
# Color Scheme: Cukup Kopi (Dark Roasted Espresso, Persimmon Orange & Cashmere Mauve)
# ------------------------------------------------------------------------------
[colors]
transparent_background_colors = true

[colors.primary]
background = "#161413"
foreground = "#E0D8D0"
bright_foreground = "#F6F1EA"
dim_foreground = "#7A726A"

[colors.cursor]
text = "#161413"
cursor = "#E87D4B"

[colors.selection]
text = "#F6F1EA"
background = "#342F2A"

[colors.normal]
black   = "#161413"
red     = "#D25C54"
green   = "#7DAE72"
yellow  = "#E87D4B"
blue    = "#5E9EA0"
magenta = "#B8969E"
cyan    = "#5E9EA0"
white   = "#E0D8D0"

[colors.bright]
black   = "#5F564F"
red     = "#E07770"
green   = "#97C58D"
yellow  = "#F2976C"
blue    = "#7AB7B9"
magenta = "#CCAEC7"
cyan    = "#7AB7B9"
white   = "#F6F1EA"

[colors.dim]
black   = "#0F0E0C"
red     = "#A84139"
green   = "#5E8955"
yellow  = "#BA5A2D"
blue    = "#427B7D"
magenta = "#917087"
cyan    = "#427B7D"
white   = "#9C9287"

# ------------------------------------------------------------------------------
# Keybindings (Word Navigation, Clear Screen, New Window, & Zellij Bottom Tabs)
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

# Window Fullscreen & Maximize Controls
[[keyboard.bindings]]
key = "F"
mods = "Command|Control"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Return"
mods = "Command"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "M"
mods = "Command|Alt"
action = "ToggleMaximized"

[[keyboard.bindings]]
key = "F"
mods = "Command|Alt"
action = "ToggleSimpleFullscreen"

[[keyboard.bindings]]
key = "K"
mods = "Command"
chars = "\u000C"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u0017"

# Zellij Bottom Tab & Split Pane Shortcuts (Replaces macOS Native Top Tab Bar)
[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u001Bt"

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u001Bw"

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u001Bd"

[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u001BD"

# Split Panes Focus Navigation (Cmd + Option + Arrows)
[[keyboard.bindings]]
key = "Left"
mods = "Command|Alt"
chars = "\u001Bh"

[[keyboard.bindings]]
key = "Right"
mods = "Command|Alt"
chars = "\u001Bl"

[[keyboard.bindings]]
key = "Up"
mods = "Command|Alt"
chars = "\u001Bk"

[[keyboard.bindings]]
key = "Down"
mods = "Command|Alt"
chars = "\u001Bj"

# Split Panes Directional Resize (Cmd + Ctrl + Arrows)
[[keyboard.bindings]]
key = "Left"
mods = "Command|Control"
chars = "\u001BH"

[[keyboard.bindings]]
key = "Right"
mods = "Command|Control"
chars = "\u001BL"

[[keyboard.bindings]]
