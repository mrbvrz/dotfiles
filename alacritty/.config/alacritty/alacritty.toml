# ==============================================================================
# Alacritty Terminal Configuration (~/.config/alacritty/alacritty.toml)
# Theme: Min Dark (Blurred)
# Managed via GNU Stow in ~/.dotfiles/alacritty/.config/alacritty/alacritty.toml
# Docs: https://alacritty.org/config-alacritty.html
# ==============================================================================

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 130, lines = 63 }
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "Buttonless"
opacity = 0.82
blur = true
option_as_alt = "Both"
startup_mode = "Windowed"

[scrolling]
history = 50000
multiplier = 3

# ------------------------------------------------------------------------------
# Typography (CommitMono Nerd Font)
# ------------------------------------------------------------------------------
[font]
size = 12.0
offset = { x = 0, y = 2 }

[font.normal]
family = "CommitMono Nerd Font"
style = "Regular"

[font.bold]
family = "CommitMono Nerd Font"
style = "Bold"

[font.italic]
family = "CommitMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CommitMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# ------------------------------------------------------------------------------
# Color Scheme: Min Dark (Blurred)
# ------------------------------------------------------------------------------
[colors.primary]
background = "#1A1A1A"
foreground = "#BBBBBB"
bright_foreground = "#F8F8F8"
dim_foreground = "#898989"

[colors.cursor]
text = "#1A1A1A"
cursor = "#F8F8F8"

[colors.selection]
text = "#F8F8F8"
background = "#2A2A2A"

[colors.normal]
black   = "#1A1A1A"
red     = "#FA7584"
green   = "#79B8FF"
yellow  = "#FFAB70"
blue    = "#B392F1"
magenta = "#E394DC"
cyan    = "#79B8FF"
white   = "#BBBBBB"

[colors.bright]
black   = "#5C5C5C"
red     = "#FF9CAA"
green   = "#A3D0FF"
yellow  = "#FFC9A3"
blue    = "#CFB8FF"
magenta = "#F3B8EC"
cyan    = "#A3D0FF"
white   = "#F8F8F8"

[colors.dim]
black   = "#000000"
red     = "#D15A68"
green   = "#5A8AC0"
yellow  = "#D18F5A"
blue    = "#8A6EC0"
magenta = "#B376B0"
cyan    = "#5A8AC0"
white   = "#898989"

# ------------------------------------------------------------------------------
# Keybindings (Word Navigation, Clear Screen, New Window, & Zellij Bottom Tabs)
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "K"
mods = "Command"
chars = "\u000C"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001Bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001Bf"

[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u0017"

# Zellij Bottom Tab & Split Pane Shortcuts (Replaces macOS Native Top Tab Bar)
[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u001Bt"

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u001Bw"

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u001Bd"

[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u001BD"

[[keyboard.bindings]]
key = "R"
