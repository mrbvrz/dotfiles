<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Baru · Cukup Kopi</title>
  <style>
    :root {
      --canvas-rgb: 22, 20, 19;
      --panel-rgb: 17, 16, 14;
      --opacity: 0.70;
      --blur: 40px;
      --text-primary: #E0D8D0;
      --text-muted: #7A726A;
      --accent: #E87D4B;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #E87D4B;
      --font-ui: "Uncut Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "CommitMono Nerd Font Mono", "CommitMono", "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text-primary);
      background-color: rgba(var(--canvas-rgb), var(--opacity));
      backdrop-filter: blur(var(--blur)) saturate(140%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
      transition: background-color 0.2s ease, backdrop-filter 0.2s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Top Action Bar */
    .top-bar {
      position: absolute;
      top: 24px;
      right: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(var(--panel-rgb), 0.5);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background: rgba(var(--panel-rgb), 0.85);
      transform: translateY(-1px);
    }

    /* Main Container */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 680px;
      width: 90%;
      margin-top: -40px;
    }

    /* Clock */
    .clock-container {
      text-align: center;
    }

    .clock-time {
      font-family: var(--font-mono);
      font-size: 5.5rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text-primary);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .clock-date {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 10px;
      letter-spacing: 0.5px;
      text-transform: capitalize;
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      position: relative;
      background: rgba(var(--panel-rgb), 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 4px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--border-focus);
      background: rgba(var(--panel-rgb), 0.85);
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box:focus-within .search-icon {
      color: var(--accent);
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 1.05rem;
      font-family: var(--font-ui);
      padding: 12px 0;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Quick Shortcuts Grid */
    .shortcuts-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }

    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(var(--panel-rgb), 0.4);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      text-decoration: none;
      min-width: 80px;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .shortcut-card:hover {
      background: rgba(var(--panel-rgb), 0.8);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .shortcut-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .shortcut-title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .shortcut-card:hover .shortcut-title {
      color: var(--text-primary);
    }

    /* Settings Modal ("settingnya") */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 440px;
      background: rgba(var(--panel-rgb), 0.92);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .setting-label span:last-child {
      font-family: var(--font-mono);
      color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    select {
      background: rgba(var(--canvas-rgb), 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-family: var(--font-ui);
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="icon-btn" id="openSettings" title="Pengaturan Tampilan Cukup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="hero">
    <div class="clock-container">
      <div class="clock-time" id="clockTime">12:00</div>
      <div class="clock-date" id="clockDate">Jumat, 7 November</div>
    </div>

    <form class="search-box" id="searchForm">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari di web atau ketik URL..." autofocus autocomplete="off">
    </form>

    <div class="shortcuts-grid" id="shortcutsGrid">
      <a href="https://github.com" class="shortcut-card">
        <div class="shortcut-icon">GH</div>
        <div class="shortcut-title">GitHub</div>
      </a>
      <a href="https://chatgpt.com" class="shortcut-card">
        <div class="shortcut-icon">AI</div>
        <div class="shortcut-title">ChatGPT</div>
      </a>
      <a href="https://claude.ai" class="shortcut-card">
        <div class="shortcut-icon">CL</div>
        <div class="shortcut-title">Claude</div>
      </a>
      <a href="https://youtube.com" class="shortcut-card">
        <div class="shortcut-icon">YT</div>
        <div class="shortcut-title">YouTube</div>
      </a>
      <a href="http://localhost:3000" class="shortcut-card">
        <div class="shortcut-icon">3K</div>
        <div class="shortcut-title">Local:3000</div>
      </a>
      <a href="http://localhost:5173" class="shortcut-card">
        <div class="shortcut-icon">VI</div>
        <div class="shortcut-title">Vite:5173</div>
      </a>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Pengaturan Tampilan Cukup</div>
        <button class="close-btn" id="closeSettings">&times;</button>
      </div>

      <div class="setting-group">
        <div class="setting-label">
          <span>Tingkat Transparansi (Opacity)</span>
          <span id="opacityVal">70%</span>
        </div>
        <input type="range" id="opacityRange" min="10" max="100" value="70">
      </div>

      <div class="setting-group">
        <div class="setting-label">
          <span>Intensitas Frosted Blur</span>
          <span id="blurVal">40px</span>
        </div>
        <input type="range" id="blurRange" min="0" max="80" value="40">
      </div>

      <div class="setting-group">
        <div class="setting-label">
          <span>Mesin Pencari</span>
        </div>
        <select id="engineSelect">
          <option value="https://google.com/search?q=">Google</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://kagi.com/search?q=">Kagi</option>
          <option value="https://perplexity.ai/search?q=">Perplexity</option>
          <option value="https://github.com/search?q=">GitHub</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = h + ':' + m;

      const opts = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('clockDate').textContent = now.toLocaleDateString('id-ID', opts);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Search
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const engineSelect = document.getElementById('engineSelect');

    const savedEngine = localStorage.getItem('cukup_engine') || 'https://google.com/search?q=';
    engineSelect.value = savedEngine;

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;
      if (q.startsWith('http://') || q.startsWith('https://') || (q.includes('.') && !q.includes(' '))) {
        location.href = q.includes('://') ? q : 'https://' + q;
      } else {
        location.href = engineSelect.value + encodeURIComponent(q);
      }
    });

    engineSelect.addEventListener('change', () => {
      localStorage.setItem('cukup_engine', engineSelect.value);
    });

    // Transparency & Blur Settings
    const opacityRange = document.getElementById('opacityRange');
    const opacityVal = document.getElementById('opacityVal');
    const blurRange = document.getElementById('blurRange');
    const blurVal = document.getElementById('blurVal');

    const savedOpacity = localStorage.getItem('cukup_opacity') || '70';
    const savedBlur = localStorage.getItem('cukup_blur') || '40';

    function applyVisuals(op, bl) {
      document.documentElement.style.setProperty('--opacity', (op / 100).toString());
      document.documentElement.style.setProperty('--blur', bl + 'px');
      opacityVal.textContent = op + '%';
      blurVal.textContent = bl + 'px';
      opacityRange.value = op;
      blurRange.value = bl;
    }

    applyVisuals(savedOpacity, savedBlur);

    opacityRange.addEventListener('input', () => {
      applyVisuals(opacityRange.value, blurRange.value);
      localStorage.setItem('cukup_opacity', opacityRange.value);
    });

    blurRange.addEventListener('input', () => {
      applyVisuals(opacityRange.value, blurRange.value);
      localStorage.setItem('cukup_blur', blurRange.value);
    });

    // Settings Modal
    const modal = document.getElementById('modalOverlay');
    document.getElementById('openSettings').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });
  </script>
</body>
</html>
